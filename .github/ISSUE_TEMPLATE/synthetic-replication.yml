name: Synthetic-replication participation
description: Volunteer as an outside causal-game author, custodian, or reviewer.
title: "[Synthetic replication] "
labels: ["synthetic-replication"]
body:
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Outside game author
        - Independent custodian
        - Independent renderer or replay verifier
        - Adversarial reviewer
    validations:
      required: true
  - type: textarea
    id: independence
    attributes:
      label: Independence and relevant experience
      description: Do not disclose hidden game mechanics, evaluator logic, or oracle material.
    validations:
      required: true
  - type: checkboxes
    id: exposure
    attributes:
      label: Scored-author eligibility
      options:
        - label: I have not seen the candidate implementation, prompts, development games, or traces.
          required: true
        - label: I am not the candidate developer or proposed custodian for my authored capsule.
          required: true
        - label: I have authority to license or submit every authored component under the published participation terms.
          required: true
        - label: I will not post hidden material, evaluator logic, secrets, or winning actions in this public issue.
          required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Affiliations and conflicts
      description: List relevant employment, funding, prior collaboration with Parslee AI or Errata contributors, and tools, models, prompts, or collaborators used. Write none if none.
    validations:
      required: true

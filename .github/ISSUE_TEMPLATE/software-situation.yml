name: Real-software participation
description: Volunteer as a situation author, custodian, adjudicator, or reviewer.
title: "[Real software] "
labels: ["real-software"]
body:
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Situation author
        - Independent custodian
        - Outcome or non-win adjudicator
        - Adversarial reviewer
    validations:
      required: true
  - type: textarea
    id: independence
    attributes:
      label: Independence and relevant experience
      description: Do not disclose hidden case details or private repository content.
    validations:
      required: true
  - type: checkboxes
    id: exposure
    attributes:
      label: Scored-author eligibility
      options:
        - label: I have not seen the Errata pursuit agent implementation, prompts, or development traces.
          required: true
        - label: I am not the candidate developer, case custodian, or outcome adjudicator for this case.
          required: true
        - label: I have authority to offer the proposed repository or contained system for evaluation and will disclose its license and any restrictions before transfer.
          required: true
        - label: I will not post hidden case material, evaluator logic, secrets, or winning actions in this public issue.
          required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Affiliations and conflicts
      description: List relevant employment, funding, prior collaboration with Parslee AI or Errata contributors, and tools or models used. Write none if none.
    validations:
      required: true
